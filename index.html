<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Scene</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-size: 16px; /* base — layout uses vw/vh, not em/rem, so font-size changes don't shift anything */
  }

  canvas#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .scene {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* ─────────────────────────────────────────
     COMET  — all sizes in vw so it scales
     ───────────────────────────────────────── */
  .comet-wrapper {
    position: absolute;
    top: 2vh;
    left: 1vw;
    width: 24vw;
    height: 9vw;
    transform: rotate(-30deg);
    transform-origin: right center;
  }

  /* Wide cone tail */
  .comet-tail {
    position: absolute;
    top: 30%;
    left: 0;
    width: 78%;
    height: 40%;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(140,200,255,0.06) 30%,
      rgba(140,200,255,0.16) 60%,
      rgba(180,220,255,0.32) 100%);
    clip-path: polygon(0 50%, 100% 0%, 100% 100%);
    filter: blur(0.3vw);
  }

  /* Tighter inner trail */
  .comet-trail {
    position: absolute;
    top: 36%;
    left: 5%;
    width: 68%;
    height: 28%;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(100,180,255,0.10) 40%,
      rgba(160,210,255,0.28) 100%);
    clip-path: polygon(0 50%, 100% 5%, 100% 95%);
    filter: blur(0.2vw);
  }

  /* ── STREAK LINES (animated) ── */
  .streak {
    position: absolute;
    height: 1.5px;
    border-radius: 2px;
    transform-origin: right center;
  }

  /* Each streak pulses its own width + opacity */
  @keyframes streak-pulse-1 {
    0%,100% { width: 56%; opacity: 0.55; }
    50%      { width: 72%; opacity: 0.85; }
  }
  @keyframes streak-pulse-2 {
    0%,100% { width: 68%; opacity: 0.45; }
    50%      { width: 80%; opacity: 0.75; }
  }
  @keyframes streak-pulse-3 {
    0%,100% { width: 74%; opacity: 0.60; }
    50%      { width: 88%; opacity: 0.95; }
  }
  @keyframes streak-pulse-4 {
    0%,100% { width: 62%; opacity: 0.50; }
    50%      { width: 78%; opacity: 0.80; }
  }
  @keyframes streak-pulse-5 {
    0%,100% { width: 54%; opacity: 0.38; }
    50%      { width: 70%; opacity: 0.65; }
  }
  @keyframes streak-pulse-6 {
    0%,100% { width: 44%; opacity: 0.32; }
    50%      { width: 58%; opacity: 0.55; }
  }
  @keyframes streak-pulse-7 {
    0%,100% { width: 36%; opacity: 0.22; }
    50%      { width: 48%; opacity: 0.42; }
  }

  /* colour: bright white-blue gradient fading left→transparent */
  .s1,.s2,.s3,.s4,.s5,.s6,.s7 {
    background: linear-gradient(to right, transparent, rgba(200,230,255,0.9));
  }
  .s1 { top: 22%; animation: streak-pulse-1 1.6s ease-in-out infinite 0.0s; }
  .s2 { top: 30%; animation: streak-pulse-2 1.9s ease-in-out infinite 0.2s; }
  .s3 { top: 38%; animation: streak-pulse-3 1.4s ease-in-out infinite 0.4s; }
  .s4 { top: 46%; animation: streak-pulse-4 1.7s ease-in-out infinite 0.1s; }
  .s5 { top: 54%; animation: streak-pulse-5 2.0s ease-in-out infinite 0.3s; }
  .s6 { top: 62%; animation: streak-pulse-6 1.8s ease-in-out infinite 0.5s; }
  .s7 { top: 70%; animation: streak-pulse-7 2.2s ease-in-out infinite 0.6s; }

  /* ── COMET BODY GLOW PULSE ── */
  @keyframes comet-glow {
    0%,100% {
      box-shadow:
        0 0 1.2vw 0.4vw rgba(80,160,255,0.75),
        0 0 2.4vw 0.9vw rgba(50,120,255,0.50),
        0 0 4vw   1.8vw rgba(30,80,220,0.28),
        inset 0 0 0.8vw rgba(200,235,255,0.35);
    }
    50% {
      box-shadow:
        0 0 1.6vw 0.6vw rgba(100,180,255,0.90),
        0 0 3.2vw 1.4vw rgba(70,150,255,0.65),
        0 0 5.5vw 2.5vw rgba(40,100,240,0.38),
        inset 0 0 1.2vw rgba(220,245,255,0.50);
    }
  }

  .comet-body {
    position: absolute;
    top: 10%;
    right: 0;
    width: 6.5vw;
    height: 6vw;
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    background: radial-gradient(ellipse at 35% 40%,
      #ffffff 0%, #a8e0ff 12%, #4db8ff 28%,
      #1a8fff 42%, #0055cc 60%, #003399 78%,
      #001166 92%, #000033 100%);
    animation: comet-glow 1.8s ease-in-out infinite;
    filter: brightness(1.15);
  }

  /* Inner flame */
  .comet-body::after {
    content: '';
    position: absolute;
    top: 20%; left: 20%;
    width: 35%; height: 38%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,240,180,0.9) 0%, rgba(255,160,60,0.6) 40%, transparent 100%);
    filter: blur(0.3vw);
  }

  /* ─────────────────────────────────────────
     PLANETS — ALL positions/sizes in vw/vh
     so font-size changes have zero effect
     ───────────────────────────────────────── */
  .planet {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%,
      #c04030 0%, #8b1a10 35%, #5a0a05 65%, #2a0202 100%);
    box-shadow: inset -0.4vw -0.3vw 1.2vw rgba(0,0,0,0.7),
                inset 0.3vw 0.2vw 0.7vw rgba(180,60,40,0.3);
  }

  .planet::before {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(0,0,0,0.25);
  }

  /* Tiny top dot */
  .p-tiny-top {
    width: 0.55vw; height: 0.55vw;
    top: 4.5vh; left: 30.5vw;
    background: radial-gradient(circle at 35% 30%, #c04030, #5a0a05);
    box-shadow: none;
  }
  .p-tiny-top::before { display: none; }

  /* Small top */
  .p-sm-top {
    width: 1.3vw; height: 1.3vw;
    top: 4vh; left: 30vw;
  }
  .p-sm-top::before { width: 0.2vw; height: 0.2vw; top: 30%; left: 30%; }

  /* Medium left */
  .p-md-left {
    width: 3.6vw; height: 3.6vw;
    top: 38vh; left: 10vw;
  }
  .p-md-left::before { width: 0.5vw; height: 0.5vw; top: 25%; left: 25%; }

  /* Small right */
  .p-sm-right {
    width: 2vw; height: 2vw;
    top: 22vh; right: 8vw;
  }
  .p-sm-right::before { width: 0.3vw; height: 0.3vw; top: 28%; left: 25%; }

  /* Large bottom-left */
  .p-lg-bottom-left {
    width: 9.5vw; height: 9.5vw;
    bottom: 2vh; left: 3vw;
    background: radial-gradient(circle at 32% 28%,
      #c84035 0%, #8c1a10 30%, #5c0c06 60%, #2e0303 100%);
  }
  .p-lg-bottom-left::before { width: 0.9vw; height: 0.9vw; top: 28%; left: 30%; }
  .p-lg-bottom-left::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    width: 1.4vw; height: 1.4vw;
    top: 55%; left: 18%;
    background: rgba(0,0,0,0.22);
    box-shadow: 2.2vw 0.8vw 0 -0.45vw rgba(0,0,0,0.18),
                0.8vw -0.6vw 0 -0.5vw rgba(0,0,0,0.15);
  }

  /* Tiny mid */
  .p-sm-mid {
    width: 1vw; height: 1vw;
    top: 62vh; left: 36vw;
    opacity: 0.85;
  }
  .p-sm-mid::before { width: 0.15vw; height: 0.15vw; top: 30%; left: 30%; }

  /* XL bottom-right */
  .p-xl-bottom-right {
    width: 19vw; height: 19vw;
    bottom: -4vh; right: -1.5vw;
    background: radial-gradient(circle at 30% 25%,
      #c04030 0%, #8b1a10 28%, #5a0a05 58%, #2a0202 88%, #150101 100%);
  }
  .p-xl-bottom-right::before { width: 1.3vw; height: 1.3vw; top: 22%; left: 28%; }
  .p-xl-bottom-right::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    width: 2vw; height: 2vw;
    top: 42%; left: 20%;
    background: rgba(0,0,0,0.22);
    box-shadow:
      3.3vw -1vw  0 -0.7vw rgba(0,0,0,0.18),
      5vw    2vw  0 -0.8vw rgba(0,0,0,0.15),
      1.5vw  3.5vw 0 -0.6vw rgba(0,0,0,0.20);
  }

  /* ── FLOAT ANIMATIONS ── */
  @keyframes float-a { 0%,100%{transform:translateY(0)}    50%{transform:translateY(-1.3vh)} }
  @keyframes float-b { 0%,100%{transform:translateY(0)}    50%{transform:translateY(-0.9vh)} }
  @keyframes float-c { 0%,100%{transform:translateY(0)}    50%{transform:translateY(-1.6vh)} }
  @keyframes float-d { 0%,100%{transform:translateY(0)}    50%{transform:translateY(-0.6vh)} }
  @keyframes float-e { 0%,100%{transform:translateY(0)}    50%{transform:translateY(-1.0vh)} }
  @keyframes float-f { 0%,100%{transform:translateY(0)}    50%{transform:translateY(-0.75vh)} }

  .p-tiny-top        { animation: float-d 3.5s ease-in-out infinite 0.2s; }
  .p-sm-top          { animation: float-d 4.2s ease-in-out infinite 0.0s; }
  .p-md-left         { animation: float-b 5.8s ease-in-out infinite 0.6s; }
  .p-sm-right        { animation: float-a 4.9s ease-in-out infinite 1.1s; }
  .p-lg-bottom-left  { animation: float-c 7.2s ease-in-out infinite 0.3s; }
  .p-sm-mid          { animation: float-e 3.8s ease-in-out infinite 2.0s; }
  .p-xl-bottom-right { animation: float-f 9.0s ease-in-out infinite 0.8s; }

  /* ─────────────────────────────────────────
     CONTENT OVERLAY
     ───────────────────────────────────────── */
  .content {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .content > * {
    pointer-events: auto;
  }

  .logo {
    width: 120px;
    height: auto;
    margin-bottom: 30px;
    animation: fadeIn 0.8s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .join-btn {
    padding: 14px 40px;
    font-size: 16px;
    font-weight: 600;
    background: rgba(140, 200, 255, 0.15);
    color: rgba(200, 230, 255, 0.95);
    border: 1.5px solid rgba(140, 200, 255, 0.4);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow:
      0 0 20px rgba(100, 180, 255, 0.3),
      inset 0 0 20px rgba(140, 200, 255, 0.1);
  }

  .join-btn:hover {
    background: rgba(140, 200, 255, 0.25);
    border-color: rgba(140, 200, 255, 0.6);
    box-shadow:
      0 0 30px rgba(100, 180, 255, 0.5),
      inset 0 0 20px rgba(140, 200, 255, 0.15);
    transform: translateY(-2px);
  }

  /* ─────────────────────────────────────────
     MODAL
     ───────────────────────────────────────── */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .modal.active {
    display: flex;
  }

  .modal-content {
    background: rgba(10, 15, 35, 0.95);
    border: 1.5px solid rgba(140, 200, 255, 0.3);
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.8),
      0 0 40px rgba(100, 180, 255, 0.2),
      inset 0 0 20px rgba(140, 200, 255, 0.05);
    animation: slideUp 0.3s ease-out;
    backdrop-filter: blur(10px);
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .modal-header {
    margin-bottom: 25px;
  }

  .modal-header h2 {
    color: #fff;
    font-size: 24px;
    margin: 0 0 8px 0;
  }

  .modal-header p {
    color: rgba(255, 255, 255, 0.6);
    margin: 0;
    font-size: 14px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    color: rgba(255, 255, 255, 0.8);
    font-size: 14px;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .form-group input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(140, 200, 255, 0.08);
    border: 1px solid rgba(140, 200, 255, 0.2);
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    transition: all 0.3s ease;
    box-sizing: border-box;
    box-shadow: inset 0 0 10px rgba(140, 200, 255, 0.05);
  }

  .form-group input::placeholder {
    color: rgba(200, 230, 255, 0.3);
  }

  .form-group input:focus {
    outline: none;
    border-color: rgba(140, 200, 255, 0.5);
    background: rgba(140, 200, 255, 0.12);
    box-shadow:
      inset 0 0 10px rgba(140, 200, 255, 0.1),
      0 0 15px rgba(100, 180, 255, 0.2);
  }

  .submit-btn {
    width: 100%;
    padding: 12px;
    background: rgba(140, 200, 255, 0.2);
    color: rgba(200, 230, 255, 0.95);
    border: 1.5px solid rgba(140, 200, 255, 0.4);
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
    box-shadow:
      0 0 15px rgba(100, 180, 255, 0.2),
      inset 0 0 10px rgba(140, 200, 255, 0.05);
  }

  .submit-btn:hover:not(:disabled) {
    background: rgba(140, 200, 255, 0.3);
    border-color: rgba(140, 200, 255, 0.6);
    box-shadow:
      0 0 25px rgba(100, 180, 255, 0.4),
      inset 0 0 10px rgba(140, 200, 255, 0.1);
    transform: translateY(-2px);
  }

  .submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .close-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.6);
    font-size: 28px;
    cursor: pointer;
    transition: color 0.3s ease;
  }

  .close-btn:hover {
    color: rgba(255, 255, 255, 1);
  }

  .error-message {
    color: #ff6b6b;
    font-size: 13px;
    margin-top: 4px;
    display: none;
  }

  .error-message.show {
    display: block;
  }

  .success-message {
    color: #51cf66;
    font-size: 13px;
    margin-top: 4px;
    display: none;
  }

  .success-message.show {
    display: block;
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="content">
  <img src="https://ffxlryusmstnfjedleds.supabase.co/storage/v1/object/public/Assets/festxlogocolour.png" alt="FestX Logo" class="logo">
  <button class="join-btn" id="joinBtn">Join Waitlist</button>
</div>

<div class="scene">

  <!-- COMET -->
  <div class="comet-wrapper">
    <div class="comet-tail"></div>
    <div class="comet-trail"></div>
    <div class="streak s1"></div>
    <div class="streak s2"></div>
    <div class="streak s3"></div>
    <div class="streak s4"></div>
    <div class="streak s5"></div>
    <div class="streak s6"></div>
    <div class="streak s7"></div>
    <div class="comet-body"></div>
  </div>

  <!-- PLANETS -->
  <div class="planet p-tiny-top"></div>
  <div class="planet p-sm-top"></div>
  <div class="planet p-md-left"></div>
  <div class="planet p-sm-right"></div>
  <div class="planet p-lg-bottom-left"></div>
  <div class="planet p-sm-mid"></div>
  <div class="planet p-xl-bottom-right"></div>

</div>

<!-- WAITLIST MODAL -->
<div class="modal" id="waitlistModal">
  <div class="modal-content">
    <button class="close-btn" id="closeBtn">&times;</button>
    <div class="modal-header">
      <h2>Join Our Waitlist</h2>
      <p>Be first to know about FestX</p>
    </div>
    <form id="waitlistForm">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" placeholder="John" required>
        <div class="error-message" id="firstNameError"></div>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
        <div class="error-message" id="emailError"></div>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required>
        <div class="error-message" id="phoneError"></div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Join Waitlist</button>
      <div class="success-message" id="successMessage">✓ Successfully joined! Check your email.</div>
    </form>
  </div>
</div>

<script>
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];

function buildStars() {
  stars = [];
  for (let i = 0; i < 520; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: 0.3 + Math.random() * 1.1,
      base:  0.55 + Math.random() * 0.45,
      speed: 0.5  + Math.random() * 2.5,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  buildStars();
}

function tick(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const ts = t * 0.001;
  for (const s of stars) {
    const alpha = Math.max(0, Math.min(1, s.base + Math.sin(ts * s.speed + s.phase) * 0.45));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }
  requestAnimationFrame(tick);
}

resize();
window.addEventListener('resize', () => { resize(); });
requestAnimationFrame(tick);

// Waitlist Modal Logic
const modal = document.getElementById('waitlistModal');
const joinBtn = document.getElementById('joinBtn');
const closeBtn = document.getElementById('closeBtn');
const waitlistForm = document.getElementById('waitlistForm');
const submitBtn = document.getElementById('submitBtn');

joinBtn.addEventListener('click', () => {
  modal.classList.add('active');
});

closeBtn.addEventListener('click', () => {
  modal.classList.remove('active');
  waitlistForm.reset();
  document.getElementById('successMessage').classList.remove('show');
});

modal.addEventListener('click', (e) => {
  if (e.target === modal) {
    modal.classList.remove('active');
    waitlistForm.reset();
    document.getElementById('successMessage').classList.remove('show');
  }
});

waitlistForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  // Clear previous error messages
  document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
  document.getElementById('successMessage').classList.remove('show');

  const firstName = document.getElementById('firstName').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();

  // Validation
  let hasError = false;

  if (!firstName) {
    document.getElementById('firstNameError').textContent = 'First name is required';
    document.getElementById('firstNameError').classList.add('show');
    hasError = true;
  }

  if (!email || !email.includes('@')) {
    document.getElementById('emailError').textContent = 'Valid email is required';
    document.getElementById('emailError').classList.add('show');
    hasError = true;
  }

  if (!phone || phone.length < 10) {
    document.getElementById('phoneError').textContent = 'Valid phone number is required';
    document.getElementById('phoneError').classList.add('show');
    hasError = true;
  }

  if (hasError) return;

  submitBtn.disabled = true;
  submitBtn.textContent = 'Joining...';

  try {
    const response = await fetch('/api/waitlist', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        first_name: firstName,
        email: email,
        phone_number: phone
      })
    });

    if (!response.ok) {
      throw new Error('Failed to join waitlist');
    }

    document.getElementById('successMessage').classList.add('show');
    waitlistForm.reset();

    setTimeout(() => {
      modal.classList.remove('active');
      document.getElementById('successMessage').classList.remove('show');
    }, 2000);

  } catch (error) {
    document.getElementById('emailError').textContent = 'Error joining waitlist. Please try again.';
    document.getElementById('emailError').classList.add('show');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Join Waitlist';
  }
});
</script>
</body>
</html>
