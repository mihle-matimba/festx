<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FestX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-size: 16px; /* base — layout uses vw/vh, not em/rem, so font-size changes don't shift anything */
  }

  canvas#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .scene {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* ─────────────────────────────────────────
     COMET  — all sizes in vw so it scales
     ───────────────────────────────────────── */
  .comet-wrapper {
    position: absolute;
    top: 2vh;
    left: 1vw;
    width: 24vw;
    height: 9vw;
    transform: rotate(-30deg);
    transform-origin: right center;
  }

  /* Wide cone tail */
  .comet-tail {
    position: absolute;
    top: 30%;
    left: 0;
    width: 78%;
    height: 40%;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(140,200,255,0.06) 30%,
      rgba(140,200,255,0.16) 60%,
      rgba(180,220,255,0.32) 100%);
    clip-path: polygon(0 50%, 100% 0%, 100% 100%);
    filter: blur(0.3vw);
  }

  /* Tighter inner trail */
  .comet-trail {
    position: absolute;
    top: 36%;
    left: 5%;
    width: 68%;
    height: 28%;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(100,180,255,0.10) 40%,
      rgba(160,210,255,0.28) 100%);
    clip-path: polygon(0 50%, 100% 5%, 100% 95%);
    filter: blur(0.2vw);
  }

  /* ── STREAK LINES (animated) ── */
  .streak {
    position: absolute;
    height: 1.5px;
    border-radius: 2px;
    transform-origin: right center;
  }

  /* Each streak pulses its own width + opacity */
  @keyframes streak-pulse-1 {
    0%,100% { width: 56%; opacity: 0.55; }
    50%      { width: 72%; opacity: 0.85; }
  }
  @keyframes streak-pulse-2 {
    0%,100% { width: 68%; opacity: 0.45; }
    50%      { width: 80%; opacity: 0.75; }
  }
  @keyframes streak-pulse-3 {
    0%,100% { width: 74%; opacity: 0.60; }
    50%      { width: 88%; opacity: 0.95; }
  }
  @keyframes streak-pulse-4 {
    0%,100% { width: 62%; opacity: 0.50; }
    50%      { width: 78%; opacity: 0.80; }
  }
  @keyframes streak-pulse-5 {
    0%,100% { width: 54%; opacity: 0.38; }
    50%      { width: 70%; opacity: 0.65; }
  }
  @keyframes streak-pulse-6 {
    0%,100% { width: 44%; opacity: 0.32; }
    50%      { width: 58%; opacity: 0.55; }
  }
  @keyframes streak-pulse-7 {
    0%,100% { width: 36%; opacity: 0.22; }
    50%      { width: 48%; opacity: 0.42; }
  }

  /* colour: bright white-blue gradient fading left→transparent */
  .s1,.s2,.s3,.s4,.s5,.s6,.s7 {
    background: linear-gradient(to right, transparent, rgba(200,230,255,0.9));
  }
  .s1 { top: 22%; animation: streak-pulse-1 1.6s ease-in-out infinite 0.0s; }
  .s2 { top: 30%; animation: streak-pulse-2 1.9s ease-in-out infinite 0.2s; }
  .s3 { top: 38%; animation: streak-pulse-3 1.4s ease-in-out infinite 0.4s; }
  .s4 { top: 46%; animation: streak-pulse-4 1.7s ease-in-out infinite 0.1s; }
  .s5 { top: 54%; animation: streak-pulse-5 2.0s ease-in-out infinite 0.3s; }
  .s6 { top: 62%; animation: streak-pulse-6 1.8s ease-in-out infinite 0.5s; }
  .s7 { top: 70%; animation: streak-pulse-7 2.2s ease-in-out infinite 0.6s; }

  /* ── COMET BODY GLOW PULSE ── */
  @keyframes comet-glow {
    0%,100% {
      box-shadow:
        0 0 1.2vw 0.4vw rgba(80,160,255,0.75),
        0 0 2.4vw 0.9vw rgba(50,120,255,0.50),
        0 0 4vw   1.8vw rgba(30,80,220,0.28),
        inset 0 0 0.8vw rgba(200,235,255,0.35);
    }
    50% {
      box-shadow:
        0 0 1.6vw 0.6vw rgba(100,180,255,0.90),
        0 0 3.2vw 1.4vw rgba(70,150,255,0.65),
        0 0 5.5vw 2.5vw rgba(40,100,240,0.38),
        inset 0 0 1.2vw rgba(220,245,255,0.50);
    }
  }

  .comet-body {
    position: absolute;
    top: 10%;
    right: 0;
    width: 6.5vw;
    height: 6vw;
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    background: radial-gradient(ellipse at 35% 40%,
      #ffffff 0%, #a8e0ff 12%, #4db8ff 28%,
      #1a8fff 42%, #0055cc 60%, #003399 78%,
      #001166 92%, #000033 100%);
    animation: comet-glow 1.8s ease-in-out infinite;
    filter: brightness(1.15);
  }

  /* Inner flame */
  .comet-body::after {
    content: '';
    position: absolute;
    top: 20%; left: 20%;
    width: 35%; height: 38%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,240,180,0.9) 0%, rgba(255,160,60,0.6) 40%, transparent 100%);
    filter: blur(0.3vw);
  }

  /* ─────────────────────────────────────────
     PLANETS — ALL positions/sizes in vw/vh
     so font-size changes have zero effect
     ───────────────────────────────────────── */
  .planet {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%,
      #c04030 0%, #8b1a10 35%, #5a0a05 65%, #2a0202 100%);
    box-shadow: inset -0.4vw -0.3vw 1.2vw rgba(0,0,0,0.7),
                inset 0.3vw 0.2vw 0.7vw rgba(180,60,40,0.3);
  }

  .planet::before {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(0,0,0,0.25);
  }

  /* Tiny top dot */
  .p-tiny-top {
    width: 0.55vw; height: 0.55vw;
    top: 4.5vh; left: 30.5vw;
    background: radial-gradient(circle at 35% 30%, #c04030, #5a0a05);
    box-shadow: none;
  }
  .p-tiny-top::before { display: none; }

  /* Small top */
  .p-sm-top {
    width: 1.3vw; height: 1.3vw;
    top: 4vh; left: 30vw;
  }
  .p-sm-top::before { width: 0.2vw; height: 0.2vw; top: 30%; left: 30%; }

  /* Medium left */
  .p-md-left {
    width: 3.6vw; height: 3.6vw;
    top: 38vh; left: 10vw;
  }
  .p-md-left::before { width: 0.5vw; height: 0.5vw; top: 25%; left: 25%; }

  /* Small right */
  .p-sm-right {
    width: 2vw; height: 2vw;
    top: 22vh; right: 8vw;
  }
  .p-sm-right::before { width: 0.3vw; height: 0.3vw; top: 28%; left: 25%; }

  /* Large bottom-left */
  .p-lg-bottom-left {
    width: 9.5vw; height: 9.5vw;
    bottom: 2vh; left: 3vw;
    background: radial-gradient(circle at 32% 28%,
      #c84035 0%, #8c1a10 30%, #5c0c06 60%, #2e0303 100%);
  }
  .p-lg-bottom-left::before { width: 0.9vw; height: 0.9vw; top: 28%; left: 30%; }
  .p-lg-bottom-left::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    width: 1.4vw; height: 1.4vw;
    top: 55%; left: 18%;
    background: rgba(0,0,0,0.22);
    box-shadow: 2.2vw 0.8vw 0 -0.45vw rgba(0,0,0,0.18),
                0.8vw -0.6vw 0 -0.5vw rgba(0,0,0,0.15);
  }

  /* Tiny mid */
  .p-sm-mid {
    width: 1vw; height: 1vw;
    top: 62vh; left: 36vw;
    opacity: 0.85;
  }
  .p-sm-mid::before { width: 0.15vw; height: 0.15vw; top: 30%; left: 30%; }

  /* XL bottom-right */
  .p-xl-bottom-right {
    width: 19vw; height: 19vw;
    bottom: -4vh; right: -1.5vw;
    background: radial-gradient(circle at 30% 25%,
      #c04030 0%, #8b1a10 28%, #5a0a05 58%, #2a0202 88%, #150101 100%);
  }
  .p-xl-bottom-right::before { width: 1.3vw; height: 1.3vw; top: 22%; left: 28%; }
  .p-xl-bottom-right::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    width: 2vw; height: 2vw;
    top: 42%; left: 20%;
    background: rgba(0,0,0,0.22);
    box-shadow:
      3.3vw -1vw  0 -0.7vw rgba(0,0,0,0.18),
      5vw    2vw  0 -0.8vw rgba(0,0,0,0.15),
      1.5vw  3.5vw 0 -0.6vw rgba(0,0,0,0.20);
  }

  /* ── FLOAT ANIMATIONS ── */
  @keyframes float-a { 0%,100%{transform:translateY(0)}    50%{transform:translateY(-1.3vh)} }
  @keyframes float-b { 0%,100%{transform:translateY(0)}    50%{transform:translateY(-0.9vh)} }
  @keyframes float-c { 0%,100%{transform:translateY(0)}    50%{transform:translateY(-1.6vh)} }
  @keyframes float-d { 0%,100%{transform:translateY(0)}    50%{transform:translateY(-0.6vh)} }
  @keyframes float-e { 0%,100%{transform:translateY(0)}    50%{transform:translateY(-1.0vh)} }
  @keyframes float-f { 0%,100%{transform:translateY(0)}    50%{transform:translateY(-0.75vh)} }

  .p-tiny-top        { animation: float-d 3.5s ease-in-out infinite 0.2s; }
  .p-sm-top          { animation: float-d 4.2s ease-in-out infinite 0.0s; }
  .p-md-left         { animation: float-b 5.8s ease-in-out infinite 0.6s; }
  .p-sm-right        { animation: float-a 4.9s ease-in-out infinite 1.1s; }
  .p-lg-bottom-left  { animation: float-c 7.2s ease-in-out infinite 0.3s; }
  .p-sm-mid          { animation: float-e 3.8s ease-in-out infinite 2.0s; }
  .p-xl-bottom-right { animation: float-f 9.0s ease-in-out infinite 0.8s; }

  /* ─────────────────────────────────────────
     CONTENT OVERLAY
     ───────────────────────────────────────── */
  .content {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .content > * {
    pointer-events: auto;
  }

  .logo {
    width: 60vw;
    max-width: 400px;
    height: auto;
    margin-bottom: 40px;
    animation: fadeIn 0.8s ease-in-out;
    filter: drop-shadow(0 0 30px rgba(220, 100, 100, 0.6))
            drop-shadow(0 0 60px rgba(200, 80, 80, 0.4))
            drop-shadow(0 0 100px rgba(180, 60, 60, 0.2));
  }

  @media (max-width: 640px) {
    .logo {
      width: 70vw;
      margin-bottom: 30px;
    }
  }


  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .join-btn {
    padding: 16px 50px;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    background: rgba(180, 60, 60, 0.15);
    color: rgba(255, 200, 200, 0.95);
    border: 1.5px solid rgba(180, 60, 60, 0.5);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow:
      0 0 20px rgba(200, 80, 80, 0.4),
      inset 0 0 20px rgba(180, 60, 60, 0.1);
    text-transform: uppercase;
  }

  .join-btn:hover {
    background: rgba(180, 60, 60, 0.25);
    border-color: rgba(200, 80, 80, 0.7);
    box-shadow:
      0 0 30px rgba(220, 100, 100, 0.6),
      inset 0 0 20px rgba(180, 60, 60, 0.15);
    transform: translateY(-2px);
  }

  /* ─────────────────────────────────────────
     WAITLIST CARD
     ───────────────────────────────────────── */
  .waitlist-card {
    position: relative;
    width: 420px;
  }

  .card-glow {
    position: absolute;
    inset: -30px;
    background: radial-gradient(circle, rgba(200, 80, 80, 0.1) 0%, transparent 70%);
    border-radius: 24px;
    z-index: -1;
  }

  .card-inner {
    backdrop-filter: blur(20px);
    background: rgba(0, 0, 0, 0.6);
    border: 1.5px solid rgba(220, 80, 80, 0.5);
    border-radius: 24px;
    padding: 40px;
    position: relative;
    overflow: hidden;
    animation: border-pulse 4s cubic-bezier(0.4, 0.0, 0.6, 1.0) infinite;
  }

  @keyframes border-pulse {
    0%, 100% {
      border-color: rgba(220, 80, 80, 0.5);
      box-shadow:
        0 0 40px rgba(220, 100, 100, 0.35),
        0 0 80px rgba(220, 80, 80, 0.2),
        0 0 120px rgba(200, 60, 60, 0.1);
    }
    50% {
      border-color: rgba(255, 120, 120, 0.8);
      box-shadow:
        0 0 60px rgba(255, 120, 120, 0.6),
        0 0 120px rgba(255, 100, 100, 0.4),
        0 0 180px rgba(220, 80, 80, 0.2);
    }
  }

  .card-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom right, rgba(255, 255, 255, 0.05), transparent);
    border-radius: 24px;
    pointer-events: none;
  }

  .card-inner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(255, 255, 255, 0.02), transparent);
    border-radius: 24px;
    pointer-events: none;
  }

  .card-header {
    text-align: center;
    margin-bottom: 30px;
    position: relative;
    z-index: 1;
  }

  .card-logo {
    width: 120px;
    height: auto;
    margin: 0 auto;
  }

  .card-content-header {
    margin-bottom: 35px;
    text-align: center;
  }

  .content-value {
    font-size: 38px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
    font-family: 'Orbitron', sans-serif;
    margin: 0 0 16px 0;
    line-height: 1.3;
  }

  .content-label {
    font-size: 14px;
    color: rgba(200, 150, 150, 0.9);
    letter-spacing: 0.5px;
    font-weight: 400;
    font-family: 'Orbitron', sans-serif;
    margin: 0;
    line-height: 1.5;
  }

  .progress-bar {
    width: 100%;
    height: 3px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    margin-bottom: 30px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, rgba(220, 100, 100, 0.8), rgba(200, 80, 80, 0.6));
    width: 33.33%;
    transition: width 0.3s ease;
    border-radius: 2px;
  }

  .card-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: relative;
  }

  .form-step {
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .form-step.active {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-label {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
  }

  .form-input {
    padding: 14px 16px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(200, 80, 80, 0.3);
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 0.5px;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
  }

  .form-input::placeholder {
    color: rgba(255, 255, 255, 0.3);
  }

  .form-input:focus {
    outline: none;
    border-color: rgba(200, 100, 100, 0.6);
    background: rgba(0, 0, 0, 0.4);
    box-shadow: 0 0 20px rgba(200, 80, 80, 0.25);
  }

  .form-button {
    padding: 14px 24px;
    background: rgba(200, 80, 80, 0.15);
    color: rgba(255, 200, 200, 0.95);
    border: 1.5px solid rgba(200, 80, 80, 0.4);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 0 20px rgba(200, 80, 80, 0.2);
  }

  .form-button:hover {
    background: rgba(200, 80, 80, 0.25);
    border-color: rgba(200, 100, 100, 0.6);
    box-shadow: 0 0 30px rgba(220, 100, 100, 0.4);
    transform: translateY(-2px);
  }

  .form-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .button-group {
    display: flex;
    gap: 12px;
  }

  .button-group .form-button {
    flex: 1;
  }

  .form-button-back {
    flex: 1;
    padding: 14px 24px;
    background: rgba(100, 100, 100, 0.15);
    color: rgba(200, 200, 200, 0.95);
    border: 1.5px solid rgba(100, 100, 100, 0.3);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 0 15px rgba(100, 100, 100, 0.15);
  }

  .form-button-back:hover {
    background: rgba(100, 100, 100, 0.25);
    border-color: rgba(120, 120, 120, 0.5);
    box-shadow: 0 0 20px rgba(100, 100, 100, 0.25);
    transform: translateY(-2px);
  }

  .success-content {
    text-align: center;
    padding: 20px 0;
  }

  .success-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(76, 175, 80, 0.15);
    border: 1.5px solid rgba(76, 175, 80, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #4caf50;
    font-family: 'Orbitron', sans-serif;
  }

  .success-title {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 12px;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 0.5px;
  }

  .success-message {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.6;
    font-family: 'Orbitron', sans-serif;
  }

  .already-on-list-content {
    text-align: center;
    padding: 20px 0;
  }

  .already-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(220, 150, 50, 0.15);
    border: 1.5px solid rgba(220, 150, 50, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #ffa500;
    font-family: 'Orbitron', sans-serif;
  }

  .already-title {
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 12px;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
  }

  .already-message {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.75);
    line-height: 1.6;
    font-family: 'Orbitron', sans-serif;
  }

  @media (max-width: 640px) {
    .waitlist-card {
      width: 90%;
      max-width: 420px;
    }

    .card-inner {
      padding: 30px 24px;
    }

    .card-title {
      font-size: 24px;
    }

    .form-row {
      flex-direction: column;
    }

    .form-button {
      width: 100%;
    }
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="content">
  <div class="waitlist-card">
    <div class="card-glow"></div>
    <div class="card-inner">
      <div class="card-header">
        <img src="https://ffxlryusmstnfjedleds.supabase.co/storage/v1/object/public/Assets/festxlogocolour.png" alt="FestX Logo" class="card-logo">
      </div>

      <div id="formContent" class="form-content">
        <div class="card-content-header">
          <h1 class="content-value">The Evolution Starts Here.</h1>
          <h2 class="content-label">Unlimited Opportunity.</h2>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <form id="waitlistForm" class="card-form">
          <!-- Step 1: Email -->
          <div class="form-step active" id="step1">
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" id="cardEmail" name="email" placeholder="your@email.com" required class="form-input">
            </div>
            <button type="button" class="form-button" onclick="nextStep(1)">Next</button>
          </div>

          <!-- Step 2: First Name -->
          <div class="form-step" id="step2">
            <div class="form-group">
              <label class="form-label">First Name</label>
              <input type="text" id="cardFirstName" name="firstName" placeholder="John" required class="form-input">
            </div>
            <div class="button-group">
              <button type="button" class="form-button-back" onclick="prevStep(2)">Back</button>
              <button type="button" class="form-button" onclick="nextStep(2)">Next</button>
            </div>
          </div>

          <!-- Step 3: Phone Number -->
          <div class="form-step" id="step3">
            <div class="form-group">
              <label class="form-label">Phone Number</label>
              <input type="tel" id="cardPhone" name="phone" placeholder="+1 (555) 000-0000" required class="form-input">
            </div>
            <div class="button-group">
              <button type="button" class="form-button-back" onclick="prevStep(3)">Back</button>
              <button type="submit" class="form-button">Join Waitlist</button>
            </div>
          </div>
        </form>
      </div>

      <div id="successContent" class="success-content" style="display: none;">
        <div class="success-icon">✓</div>
        <h3 class="success-title">You're on the list!</h3>
        <p class="success-message">We'll notify you when we launch. Thanks for joining!</p>
      </div>

      <div id="alreadyOnListContent" class="already-on-list-content" style="display: none;">
        <div class="already-icon">⚡</div>
        <h3 class="already-title">Already In.</h3>
        <p class="already-message">You're already on the Evolution. We'll keep you updated!</p>
      </div>
    </div>
  </div>
</div>

<div class="scene">

  <!-- COMET -->
  <div class="comet-wrapper">
    <div class="comet-tail"></div>
    <div class="comet-trail"></div>
    <div class="streak s1"></div>
    <div class="streak s2"></div>
    <div class="streak s3"></div>
    <div class="streak s4"></div>
    <div class="streak s5"></div>
    <div class="streak s6"></div>
    <div class="streak s7"></div>
    <div class="comet-body"></div>
  </div>

  <!-- PLANETS -->
  <div class="planet p-tiny-top"></div>
  <div class="planet p-sm-top"></div>
  <div class="planet p-md-left"></div>
  <div class="planet p-sm-right"></div>
  <div class="planet p-lg-bottom-left"></div>
  <div class="planet p-sm-mid"></div>
  <div class="planet p-xl-bottom-right"></div>

</div>

<script>
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];

function buildStars() {
  stars = [];
  for (let i = 0; i < 520; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: 0.3 + Math.random() * 1.1,
      base:  0.55 + Math.random() * 0.45,
      speed: 0.5  + Math.random() * 2.5,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  buildStars();
}

function tick(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const ts = t * 0.001;
  for (const s of stars) {
    const alpha = Math.max(0, Math.min(1, s.base + Math.sin(ts * s.speed + s.phase) * 0.45));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }
  requestAnimationFrame(tick);
}

resize();
window.addEventListener('resize', () => { resize(); });
requestAnimationFrame(tick);

// Multi-step Form Handling
let currentStep = 1;
const waitlistForm = document.getElementById('waitlistForm');
const formContent = document.getElementById('formContent');
const successContent = document.getElementById('successContent');
const alreadyOnListContent = document.getElementById('alreadyOnListContent');

function updateProgressBar() {
  const progressFill = document.getElementById('progressFill');
  progressFill.style.width = (currentStep * 33.33) + '%';
}

function showStep(step) {
  // Hide all steps
  document.querySelectorAll('.form-step').forEach(el => el.classList.remove('active'));

  // Show current step
  document.getElementById(`step${step}`).classList.add('active');
  updateProgressBar();
}

function nextStep(step) {
  const email = document.getElementById('cardEmail').value.trim();
  const firstName = document.getElementById('cardFirstName').value.trim();

  if (step === 1) {
    if (!email || !email.includes('@')) {
      alert('Please enter a valid email');
      return;
    }
    currentStep = 2;
  } else if (step === 2) {
    if (!firstName) {
      alert('Please enter your first name');
      return;
    }
    currentStep = 3;
  }

  showStep(currentStep);
}

function prevStep(step) {
  currentStep = step - 1;
  showStep(currentStep);
}

waitlistForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('cardEmail').value.trim();
  const firstName = document.getElementById('cardFirstName').value.trim();
  const phone = document.getElementById('cardPhone').value.trim();

  if (!email || !email.includes('@')) {
    alert('Please enter a valid email');
    return;
  }

  if (!firstName) {
    alert('Please enter your first name');
    return;
  }

  if (!phone || phone.length < 10) {
    alert('Please enter a valid phone number');
    return;
  }

  const button = waitlistForm.querySelector('[type="submit"]');
  const originalText = button.textContent;
  button.disabled = true;
  button.textContent = 'JOINING...';

  try {
    const response = await fetch('/api/waitlist', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        first_name: firstName,
        email: email,
        phone_number: phone
      })
    });

    if (response.ok) {
      formContent.style.display = 'none';
      successContent.style.display = 'block';
    } else if (response.status === 409) {
      formContent.style.display = 'none';
      alreadyOnListContent.style.display = 'block';
    } else {
      alert('Error joining. Try again.');
      button.disabled = false;
      button.textContent = originalText;
    }
  } catch (error) {
    console.error('Error:', error);
    alert('Error joining. Try again.');
    button.disabled = false;
    button.textContent = originalText;
  }
});

// Initialize first step
showStep(1);
</script>
</body>
</html>
